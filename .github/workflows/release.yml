# Tests every push to main. A version tag (v1.2.3) also builds register.pyz, publishes it as a
# GitHub release, and publishes the demo site on the gh-pages branch, rebuilt from the tagged code.
#
# Releasing: set __version__ in register/__init__.py and add a "## 1.2.3" section to
# CHANGELOG.md in the same commit (the tests check that they agree), push main, then:
#     git tag v1.2.3 && git push origin v1.2.3
#
# Nothing is released unless the tests and the demo's own checks pass. If a later step fails,
# fix the cause and use "Re-run failed jobs" (not "Re-run all jobs": the release would exist
# already). Release tags cannot be moved or deleted, so a fix that needs a change on main
# needs a new version, and so does a demo site that was built wrong (a re-run reuses the site
# already built). The demo site is published only by the newest release, so re-running an
# older one never puts its site back.
name: test and release

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install cryptography (for the matrix Python, and for the system Python that runs register.pyz)
        run: |
          python -m pip install --disable-pip-version-check cryptography
          /usr/bin/python3 -c 'import cryptography' 2>/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography; }
      - run: python -m unittest discover -s tests

  # Builds the demo site from the tagged code and runs its checks, with a read-only token: this
  # job installs third-party packages and browsers, so it gets no write access at all.
  demo-build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      REGISTER_SOURCE: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the demo checks' requirements
        run: |
          python -m pip install --disable-pip-version-check cryptography playwright==1.52.0
          python -m playwright install --with-deps chromium firefox webkit
      - name: Build the site and check it
        run: |
          python pages/_demo/build_demo.py site --cname "$(cat pages/CNAME)"
          python -m unittest discover -s pages/_demo
          python pages/_demo/check_demo.py site
          python pages/_demo/demo_differential.py site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: demo-site
          path: site/
          if-no-files-found: error
          retention-days: 30  # as long as GitHub allows a run to be re-run

  release:
    needs: [test, demo-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # to check that the tag is on main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the tag against main and the version, and take the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          code=$(python -c 'import register; print(register.__version__)')
          [ "$code" = "$version" ] \
            || { echo "::error::$GITHUB_REF_NAME does not match __version__ $code in register/__init__.py"; exit 1; }
          awk -v v="## $version" '$0 == v {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md \
            || { echo "::error::the '## $version' section of CHANGELOG.md is missing or empty"; exit 1; }
      - name: Build register.pyz
        run: |
          python build.py
          (cd dist && sha256sum register.pyz > register.pyz.sha256)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/register.pyz dist/register.pyz.sha256 \
            --verify-tag --title "account-register ${GITHUB_REF_NAME#v}" --notes-file notes.md

  # Puts the checked site on gh-pages and publishes it. Runs no downloaded code.
  demo:
    needs: [release, demo-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # to push to gh-pages
      pages: write     # to start the Pages build
    concurrency:
      group: gh-pages  # one push to gh-pages at a time, each from the latest gh-pages
      cancel-in-progress: false
      queue: max  # keep every waiting job: an older release's must not cancel a newer one's
    steps:
      - name: Leave the site to a newer release
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName -q '.[].tagName')
          newest=$(printf '%s\n' "$tags" | sort -V | tail -n 1)
          [ -n "$newest" ] || { echo "::error::could not list the releases"; exit 1; }
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$newest is newer than $GITHUB_REF_NAME; the site is left as it is"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.newest.outputs.publish
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: steps.newest.outputs.publish
        with:
          name: demo-site
          path: site
      - name: Commit and push to gh-pages
        if: steps.newest.outputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the artifact comes from a job that ran downloaded code: plain top-level files only,
          # so that nothing in it can reach .git, _demo/ or README.md
          odd=$(find site -mindepth 1 \( ! -type f -o -name '.*' -o -name '_*' -o -name README.md \) -print)
          [ -z "$odd" ] || { echo "::error::unexpected entries in the artifact: $(echo "$odd" | tr '\n' ' ')"; exit 1; }
          cmp -s site/CNAME pages/CNAME || { echo "::error::the artifact's CNAME differs from gh-pages"; exit 1; }
          for f in site/*; do
            [ "$(head -c 3 "$f")" != --- ] || { echo "::error::$f begins with front matter, which Jekyll would process"; exit 1; }
          done
          # replace the previous build; _demo/, dotfiles and README.md are the branch's own
          find pages -maxdepth 1 -type f ! -name '.*' ! -name '_*' ! -name README.md -delete
          cp site/* pages/
          cd pages
          safe() { git -c core.hooksPath=/dev/null -c core.fsmonitor=false "$@"; }
          safe add -A -- . ':(exclude)_demo'
          if safe diff --cached --quiet; then
            echo "The site is unchanged."
            exit 0
          fi
          safe -c user.name=GaijinSystems -c user.email=17348508+GaijinSystems@users.noreply.github.com \
            commit -q -m "Demo site, built from account-register ${GITHUB_REF_NAME#v}"
          safe push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
      - name: Publish and check the site
        if: steps.newest.outputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's documentation says a push made with this job's token starts no Pages build, but
          # one may start anyway: give it a minute to appear, and request a build only if none did
          commit=$(git -C pages rev-parse HEAD)
          latest() { gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status + " " + .commit + " " + .created_at'; }
          start=$(date -u +%FT%TZ)
          for _ in $(seq 6); do
            state=$(latest) || state=
            case "$state" in "queued $commit "*|"building $commit "*|"built $commit "*) break ;; esac
            sleep 10
          done
          case "$state" in
            "queued $commit "*|"building $commit "*|"built $commit "*) ;;
            *) gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null ;;
          esac
          built=
          for _ in $(seq 60); do
            state=$(latest) || state=
            case "$state" in
              "built $commit "*) built=1; break ;;
              "errored $commit "*)  # an error from before this attempt is not this build's
                [ "${state##* }" \< "$start" ] || { echo "::error::the Pages build of $commit failed"; exit 1; } ;;
            esac
            sleep 10
          done
          [ -n "$built" ] || { echo "::error::Pages did not finish building $commit in 10 minutes"; exit 1; }
          # the live site serves exactly the files just published, and not _demo/; the CDN may
          # keep old copies for up to 10 minutes, and ignores the query string
          domain=$(cat pages/CNAME)
          files=$(cd site && find . -type f ! -name CNAME | sed 's|^\./||')
          same() { curl -sSf --max-time 30 "https://$domain/$1?release=$commit" | cmp -s - "site/$1"; }
          code() { curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "https://$domain/$1?release=$commit"; }
          for _ in $(seq 40); do
            bad=
            for f in $files; do same "$f" || bad="$bad $f"; done
            [ "$(code "")" = 200 ] || bad="$bad /"
            [ "$(code _demo/README.md)" = 404 ] || bad="$bad _demo/"
            [ -z "$bad" ] && exit 0
            sleep 15
          done
          echo "::error::not as published:$bad"
          exit 1
